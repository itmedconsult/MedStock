name: Enforce main source branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

jobs:
  require-dev-source:
    name: Require dev as source branch
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests to main must come from the dev branch."
            exit 1
          fi

          echo "Source branch is dev."
